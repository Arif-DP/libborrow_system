<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Tetap mempertahankan style asli kamu tanpa ada yang diubah */
        .btn-kembali { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-kembali:hover { background: #2563eb; }
        .btn-kembali:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        .badge-info { background: #e2e8f0; color: #475569; display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>ID Transaksi</th>
                    <th>ID Anggota</th>
                    <th>Judul Buku</th>
                    <th>Tanggal Pinjam</th>
                    <th>Batas Kembali</th>
                    <th>Status</th>
                    <th>Denda</th>
                    <th style="text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="sirkulasi-list"></tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadSirkulasi);

        async function loadSirkulasi() {
            const tbody = document.getElementById("sirkulasi-list");
    
            // AMBIL DATA LOGIN DARI LOCALSTORAGE
            const role = localStorage.getItem("user_role");
            const emailLogin = localStorage.getItem("user_email");
            const userId = localStorage.getItem("user_id"); 

            // LOGIKA JALUR URL (Menyesuaikan @GetMapping di Java kamu)
            let url = "https://tours-chuck-epa-hollywood.trycloudflare.com/api/peminjaman";

            if (role === "Admin") {
                // Jika Admin, kirim parameter role
                url += "?role=Admin";
            } else if (userId) {
                // Jika Anggota, kirim parameter userId
                url += `?userId=${userId}`;
            }

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem("token"),
                        'Content-Type': 'application/json'
                    }
                }); // <-- PENUTUP INI YANG HILANG SEBELUMNYA

                const daftarSirkulasi = await response.json();

                console.log("Data sirkulasi dari Java:", daftarSirkulasi);

                tbody.innerHTML = "";

                // Pengaman jika data dari backend berbentuk Pageable/Object bungkus
                let listData = [];
                if (Array.isArray(daftarSirkulasi)) {
                    listData = daftarSirkulasi;
                } else if (daftarSirkulasi && Array.isArray(daftarSirkulasi.content)) {
                    listData = daftarSirkulasi.content;
                }

                if (listData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">Belum ada transaksi peminjaman.</td></tr>`;
                    return;
                }

                listData.forEach(pinjam => {
                    const row = document.createElement("tr");

                    // 1. Format ID Transaksi
                    const idAman = pinjam.id || 0;
                    const formatTxId = "TR-2026-" + String(idAman).padStart(3, '0');

                    // 2. Format Badge Status
                    const statusAman = pinjam.status ? pinjam.status.toString().toLowerCase() : "";
                    const badgeStatus = (statusAman === "dipinjam")
                        ? `<span class="badge badge-warning">Dipinjam</span>`
                        : `<span class="badge badge-success">Selesai</span>`;

                    // 3. Hitung Denda
                    let jumlahDenda = 0;
                    if (pinjam.denda) {
                        jumlahDenda = typeof pinjam.denda === 'object' ? (pinjam.denda.jumlah || 0) : pinjam.denda;
                    }
                    const infoDenda = `<b>Rp ${jumlahDenda.toLocaleString('id-ID')}</b>`;

                    // 4. 🛠️ PERBAIKAN LOGIKA TOMBOL AKSI 
                    let aksiKolom = "";
                    if (statusAman === "dipinjam") {
                        aksiKolom = `<button class="btn-kembali" onclick="prosesPengembalian(${idAman})">Kembalikan</button>`;
                    } else {
                        aksiKolom = `<span class="badge-info">Selesai</span>`;
                    }

                    const noAnggotaAman = (pinjam.user && pinjam.user.noAnggota) ? pinjam.user.noAnggota : 'AG-000';
                    const judulBukuAman = (pinjam.buku && pinjam.buku.judul) ? pinjam.buku.judul : 'Buku Tanpa Judul';
                    const tglPinjamAman = pinjam.tanggalPinjam || '-';
                    const tglKembaliAman = pinjam.batasKembali || '-'; 

                    row.innerHTML = `
                        <td><b>${formatTxId}</b></td>
                        <td>${noAnggotaAman}</td>
                        <td>${judulBukuAman}</td>
                        <td>${tglPinjamAman}</td>
                        <td>${tglKembaliAman}</td>
                        <td>${badgeStatus}</td>
                        <td>${infoDenda}</td>
                        <td style="text-align: center;">${aksiKolom}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("Gagal memuat data sirkulasi:", error);
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:red;">Gagal memuat data sirkulasi dari backend. silakan cek Console.</td></tr>`;
            }
        }

        async function prosesPengembalian(peminjamanId) {
            if (confirm("Apakah Anda yakin ingin memproses pengembalian buku untuk transaksi ini?")) {
                try {
                    const currentUserId = localStorage.getItem("user_id");
                    const currentUserRole = localStorage.getItem("user_role");

                    const response = await fetch(`https://tours-chuck-epa-hollywood.trycloudflare.com/api/peminjaman/kembali/${peminjamanId}?userId=${currentUserId}&role=${currentUserRole}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + localStorage.getItem("token"),
                            'Content-Type': 'application/json'
                        }
                    });

                    const resultMessage = await response.text();

                    if (response.ok) {
                        alert(resultMessage); 
                        loadSirkulasi(); 
                    } else {
                        alert("Gagal memproses pengembalian: " + (resultMessage || "Terjadi kesalahan pada server."));
                    }
                } catch (error) {
                    console.error("Terjadi kendala jaringan:", error);
                    alert("Tidak dapat terhubung ke server backend. Pastikan server Spring Boot Anda sedang menyala.");
                }
            }
        }
    </script>
</body>
</html>
