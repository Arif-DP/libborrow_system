<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuatkan... - Lib-Borrow</title>
    <script>
        // Fungsi Router Automatik (Auth Guard)
        function periksaStatusLogin() {
            const nama = localStorage.getItem("user_name");
            const role = localStorage.getItem("user_role");

            // Jika sesi login wujud, terus ke dashboard
            if (nama && role) {
                window.location.href = "dashboard.html";
            } else {
                // Jika tiada sesi, hantar ke halaman login
                window.location.href = "login.html";
            }
        }

        // Jalankan pemeriksaan sebaik sahaja halaman dimuatkan
        window.onload = periksaStatusLogin;
    </script>
</head>
<body style="background: #1e3a8a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; color: white;">
    <div style="text-align: center;">
        <div style="font-size: 40px; margin-bottom: 20px; animation: spin 1s linear infinite;">⏳</div>
        <h2>Menghubungkan ke Sistem...</h2>
        <p style="color: #93c5fd;">Sila tunggu sebentar.</p>
    </div>
</body>
</html>
