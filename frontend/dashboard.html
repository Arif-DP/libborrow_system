<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lib-Borrow - Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .navbar { background: var(--dark-slate); color: white; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; height: 65px; }
        .brand { font-size: 18px; font-weight: 700; background: linear-gradient(to right, #3b82f6, #60a5fa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .user-menu { display: flex; align-items: center; gap: 16px; }
        .badge-user { background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; font-size: 13px; }
        .btn-out { background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-out:hover { background: var(--danger-hover); }
        .tabs-container { background: #fff; padding: 0 24px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
        .tab-btn { background: none; border: none; padding: 16px 12px; font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer; position: relative; }
        .tab-btn.active { color: var(--primary); font-weight: 600; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--primary); }
        .iframe-content { flex: 1; width: 100%; border: none; background: var(--bg-app); }
        .footer-status { background: #fff; border-top: 1px solid var(--border); padding: 12px 24px; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .footer-status::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--success); border-radius: 50%; }
        /* Custom Alert Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-card { background: white; padding: 30px; border-radius: 12px; max-width: 380px; width: 90%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-card button { background: var(--dark-slate); color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; margin-top: 20px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <div class="modal" id="alert-modal">
        <div class="modal-card">
            <div style="font-size:30px; margin-bottom:10px;">⚠️</div>
            <h3>Akses Terbatas</h3>
            <p style="font-size:14px; color:var(--text-muted); margin-top:8px;">Halaman Manajemen Anggota hanya bisa diakses oleh Admin!</p>
            <button onclick="tutupModal()">Saya Mengerti</button>
        </div>
    </div>

    <div class="navbar">
        <div class="brand">Lib-Borrow Dashboard</div>
        <div class="user-menu">
            <div class="badge-user" id="profile-display">Memuat...</div>
            <button class="btn-out" onclick="logout()">Keluar</button>
        </div>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="gantiTab(0, 'katalog.html')">Katalog Buku</button>
        <button class="tab-btn" onclick="gantiTab(1, 'sirkulasi.html')">Peminjaman</button>
        <button class="tab-btn" onclick="gantiTab(2, 'anggota.html')">Manajemen Anggota (Admin)</button>
        <button class="tab-btn" onclick="gantiTab(3, 'notifikasi.html')">Notifikasi</button>
        <button class="tab-btn" onclick="gantiTab(4, 'reservasi.html')">Reservasi</button>
    </div>

    <iframe src="katalog.html" class="iframe-content" id="content-frame"></iframe>

    <div class="footer-status" id="footer-text">Menampilkan Katalog Buku Tersedia</div>

    <script>
        // Proteksi: Cek status login
        const name = localStorage.getItem("user_nama");
        const role = localStorage.getItem("user_role");
        
        if (!name) { 
            window.location.href = "login.html"; 
        }

        document.getElementById("profile-display").innerText = `${name} [${role}]`;

        const statusMap = [
            "Menampilkan Katalog Buku Tersedia",
            "Transaksi Peminjaman dan Pengembalian Buku",
            "Panel Manajemen Otoritas Anggota (Admin Perpustakaan)",
            "Kotak Masuk Notifikasi",
            "Kelola Reservasi Buku dan Status Antrian Anda"
        ];

        function gantiTab(index, fileUrl) {
            // 👉 PROTEKSI AKSES: Validasi role sebelum memuat file ke iframe
            if (index === 2 && role !== "Admin") {
                document.getElementById("alert-modal").style.display = "flex";
                return;
            }

            // Ganti tab aktif secara visual
            const btns = document.querySelectorAll(".tab-btn");
            btns.forEach((btn, i) => btn.classList.toggle("active", i === index));

            // Muat file ke iframe & update status bar footer
            document.getElementById("content-frame").src = fileUrl;
            document.getElementById("footer-text").innerText = statusMap[index];
        }

        function tutupModal() { document.getElementById("alert-modal").style.display = "none"; }
        function logout() { localStorage.clear(); window.location.href = "login.html"; }
    </script>
</body>
</html>
